<!DOCTYPE html>
<html>
<head>
    <title>
        travel planner
    </title>
</head>
<body>

<h1>Hunter Canole Travel Planner</h1>

<form>
<input type="checkbox" id="Caribbean" name="Caribbean"
value=True >
<label for="Caribbean">Caribbean</label></br>
<input type="checkbox" id="Mediterranean" name="Mediterranean"
value=True>
<label for="Mediterranean">Mediterranean</label></br>
<input type="checkbox" id="Baltic" name="Baltic" value=False>
<label for="Baltic">Baltic</label></br>
<input type="button" onclick="choices()" value="Cruise Choices">
</form>

<form>
    <label for="orfin">Enter starting city</label>
    <input type ="text" id="orgin" name="origin city" value="Athens"> <br>

    <label for="terminal">Enter ending city </label>
    <input type ="text" id="terminal" name="terminal city"> <br>

    <input type="button" onclick="updateTrip()" value="Update the trip">
</form>

<p id="result"></p>

<script> 
var my_trip = {}

function updateTrip(){
     orgin = document.getElementById("orgin").value
     terminal = document.getElementById("terminal").value
     my_trip.start_city = orgin
     my_trip.end_city = terminal
     document.getElementById("result").innerHTML =
        "Trip Start: " + my_trip.start_city +
        "<br> Caribbean: " + my_trip.cari +
        "<br> Mediterranean: " + my_trip.medi +
        "<br> Baltic: " + my_trip.balt + 
        "<br> Trip End: " + my_trip.end_city;
}

function choices (){
    my_trip = {}
    my_trip.cari = document.getElementById("Caribbean").checked
    my_trip.medi = document.getElementById("Mediterranean").checked
    my_trip.balt = document.getElementById("Baltic").checked
    document.getElementById("result").innerHTML =
        "Caribbean: " + my_trip.cari + "<br>" +
        "Mediterranean: " + my_trip.medi + "<br>" +
        "Baltic: " + my_trip.balt;
}
</script>

</body>
</html>
