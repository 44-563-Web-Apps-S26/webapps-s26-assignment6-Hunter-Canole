<!DOCTYPE html>
<html>
 <head>
    <title>
        Assignment 6 Villans
    </title>
    <h1>
        Villains by Hunter Canole
    </h1>
</head>
<body>

<h2>Getting input</h2>

<form>
    <label for="Joker">Funny Man </label>
    <input type ="password" id="Joker" name="Joker" > <br>

    <label for="form1_nick">Guess the villain </label>
    <input type ="text" id="form1_nick" name="check"> <br>

    <input type="button" onclick="checkVillain()" value="Check the guess">
</form>


<p id="result"></p>

 <div class="container">
    <img id="treePic" src="Cedar_tree.jpg" class="img-fluid" alt="Cedar Tree" style="width:150px;height:150px;" onclick=updatePic()>
  </div>

<script> 
var caught = 0
var gotAway = 0
var usePic = 1

function updatePic(){
    var img = document.getElementById("treePic")
    switch (usePic) {
    case 1:
        img.src = "Elm_tree.jpg";
            img.alt = "Elm Tree";
            usePic = 2;
        break;
    case 2:
        img.src = "Oak_tree.webp";
            img.alt = "Oak Tree";
            usePic = 3;
        break;
    case 3:
        img.src = "Cedar_tree.jpg";
            img.alt = "Cedar Tree";
            usePic = 1;
        break;
}
}
function checkVillain(){
    villian = document.getElementById("Joker").value
    guess = document.getElementById("form1_nick").value
    
    if(guess === villian){
        alert("You caught them")
        caught = caught + 1
    } else {
        alert("Maybe next time")
        gotAway += 1
    }
    document.getElementById("result").innerHTML = "Caught: " + caught + "  Got Away: " + gotAway;
}
function resolveForm (){
    console.log("Getting form values")
    age = document.getElementById("form1_age").value
    nick = document.getElementById("form1_nick").value
    confirmed = confirm("Are these the values? "+age+" and "+nick)
    
    out = document.getElementById("result")
    if(confirmed){
        out.innerHTML = "Values were confirmed"
    } else {
        out.innerHTML = "Values were not confirmed"
    }
}
</script>

</body>
</html>
